{% extends "base.html" %}
{% block title %}#{{ term.name }} · {{ config.title }}{% endblock title %}
{% block content %}
<section class="section page-head">
  <div class="wrap narrow">
    <a class="back" href="{{ get_url(path='@/notes/_index.md') }}">← All notes</a>
    <h2 class="section-title">#{{ term.name }}</h2>
    <ul class="note-list">{% for p in term.pages %}{{<note_card p={p} />}}{% endfor %}</ul>
  </div>
</section>
{% endblock content %}
