[package]
name = "site"
version = "0.1.0"
edition = "2021"
description = "Helper CLI for astroumeda.github.io: create news/notes and sync papers from NASA/ADS"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
