# Publications. Edit by hand (copy a block to the top of its list), or regenerate
# everything from NASA/ADS with `site papers sync` (see README).
# "Umeda" in `authors` is highlighted automatically.

ads_query = "https://ui.adsabs.harvard.edu/search/q=author%3A%22Umeda%2C%20Hiroya%22&sort=date%20desc%2C%20bibcode%20desc&p_=0"

# Used by `site papers sync`. "=" asks ADS for an exact name match, so papers by other
# "Umeda, H." authors are not pulled in. Using your ORCID instead is even more robust:
#   query = 'orcid:0000-0000-0000-0000 (property:refereed OR doctype:eprint)'
[sync]
query = 'author:"=Umeda, Hiroya" (property:refereed OR doctype:eprint)'
surname = "Umeda"
exclude = []   # bibcodes to hide

